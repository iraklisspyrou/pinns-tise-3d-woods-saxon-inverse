[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woods-saxon-pinn"
version = "0.1.0"
description = "Coupled forward-inverse PINN for global Woods-Saxon identification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

